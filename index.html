<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071827"><title>Cockpit Muscu 2.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152139;background:#071827}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:480px;min-height:100dvh;margin:auto;background:linear-gradient(150deg,#071522,#0b2538 55%,#071522);padding-bottom:calc(25px + env(safe-area-inset-bottom))}header{padding:calc(19px + env(safe-area-inset-top)) 18px 12px;color:white}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:750;letter-spacing:-.7px}.brand svg{width:43px;height:34px}.blue{color:#1888ff}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:22px}.nav button{background:none;color:#b7c6d5;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;padding:3px 0 12px;border-bottom:2px solid transparent}.nav button.active{color:#218dff;border-color:#218dff}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.search{margin-top:16px;display:flex;gap:10px;align-items:center;border:1px solid #4b657b;border-radius:11px;background:#152b3d;padding:11px 13px;color:#a8bdcf}.search input{outline:0;background:none;border:0;color:white;width:100%;font-size:14px}.search input::placeholder{color:#a8bdcf}.chips{display:flex;gap:7px;overflow:auto;padding:13px 0 2px;scrollbar-width:none}.chips button{white-space:nowrap;color:#dce8f3;background:#1b3448;border:1px solid #314e64;border-radius:20px;padding:9px 13px;font-size:13px}.chips button.active{background:#087dff;border-color:#087dff;color:white}.content{padding:0 13px}.list{background:white;border-radius:11px;overflow:hidden}.exercise{display:flex;align-items:center;width:100%;min-height:71px;padding:9px 12px 9px 8px;border-bottom:1px solid #e4e9ef;gap:12px;text-align:left}.exercise:last-child{border:0}.thumb{height:51px;width:62px;flex:none;border-radius:6px;background:linear-gradient(135deg,#e7edf3,#c8d6e4);display:flex;align-items:center;justify-content:center;color:#587087;font-size:11px;font-weight:650;text-align:center;overflow:hidden}.thumb img{height:100%;width:100%;object-fit:cover}.exercise strong{font-size:15px;display:block}.exercise small{font-size:12px;color:#637187;display:block;margin-top:4px}.star{background:none;margin-left:auto;font-size:24px;color:#718094;padding:8px}.star.on{color:#087dff}.hidden{display:none!important}.detailHead{display:flex;align-items:center;gap:13px}.back{font-size:29px;background:none;color:white;padding:0 4px}.detailTitle{font-size:21px;font-weight:750}.detailSub{font-size:13px;color:#d0deea;margin-top:4px}.detailFav{background:none;color:#1688ff;font-size:25px;margin-left:auto}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:18px}.tabs button{background:#1d3547;border:1px solid #3a5264;color:#fff;padding:12px 4px;border-radius:9px;font-size:13px}.tabs button.active{background:white;color:#087dff;font-weight:700;border-color:white;box-shadow:0 3px 0 #087dff}.sheet{margin:0 12px;background:white;border-radius:11px;padding:13px;min-height:calc(100dvh - 180px - env(safe-area-inset-top));display:flex;flex-direction:column}.sheet h3{font-size:16px;margin:13px 0 7px}.sheet p{font-size:14px;line-height:1.5;color:#55647a;margin:0 0 11px}.anatomy{width:100%;height:auto;display:block}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#35445a;margin:10px 0}.dot{display:inline-block;width:10px;height:10px;background:#fa4d37;border-radius:50%;margin-right:5px}.dot.orange{background:#ff9b20}.add,.primary{width:100%;background:#087dff;color:white;padding:14px 12px;border-radius:9px;font-weight:700;font-size:15px}.add{margin-top:auto}.move{width:100%;height:auto;display:block;border-radius:8px}.notice{background:#eef4fb;border-radius:10px;padding:14px;color:#51627a;font-size:13px;line-height:1.5;margin:12px 0}.tips{background:#eaf3ff;border-radius:10px;padding:14px;font-size:13px;margin:12px 0}.tips div{margin:9px 0}.check{color:#087dff;font-weight:800;margin-right:8px}.panel{color:white;padding:0 16px}.panel h2{font-size:23px;margin:8px 0 15px}.card{background:white;color:#16243c;border-radius:12px;padding:16px;margin-bottom:12px}.card p{font-size:14px;color:#617088;line-height:1.5}.session-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7ecf1;padding:11px 0;font-size:14px;gap:8px}.session-item:last-child{border:0}.smallbtn{background:#eaf3ff;color:#087dff;padding:8px 11px;border-radius:8px;font-weight:700}.danger{background:#fff0f0;color:#c53535}.empty{color:#c2d0dc;text-align:center;padding:30px 15px}.stat{font-size:28px;font-weight:750;color:#087dff}.formrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.formrow label{font-size:12px;color:#53647a}.formrow input{width:100%;margin-top:4px;border:1px solid #d7e0e9;border-radius:7px;padding:10px;font-size:16px}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e7ecf1}.setting:last-child{border:0}a{color:#087dff}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#122f47;color:white;padding:12px 18px;border-radius:10px;box-shadow:0 8px 25px #0005;max-width:90%;font-size:13px;display:none;z-index:3}
</style></head><body><div class="app"><section id="home"><header><div class="brand"><svg viewBox="0 0 50 40" fill="none" stroke="#1788ff" stroke-width="4"><path d="M4 20h42M9 9v22M15 4v32M35 4v32M41 9v22"/></svg><span><span class="blue">Cockpit</span> Muscu</span></div><nav class="nav" id="nav"><button data-nav="Séances"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 3v6m8-6v6M3 11h18"/></svg>Séances</button><button data-nav="Bibliothèque" class="active"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2zm0 14a2 2 0 0 1 2-2h14M8 7h8m-8 4h8"/></svg>Bibliothèque</button><button data-nav="Statistiques"><svg viewBox="0 0 24 24"><path d="M4 20V11h4v9m4 0V4h4v16m4 0v-7h4v7M2 20h20"/></svg>Statistiques</button><button data-nav="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1A8 8 0 0 0 15 6l-.4-2.5h-4.2L10 6a8 8 0 0 0-1.6 1L6 6l-2 3.5L6 11a7 7 0 0 0 0 2l-2 1.5L6 18l2.4-1A8 8 0 0 0 10 18l.4 2.5h4.2L15 18a8 8 0 0 0 1.6-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>Réglages</button></nav><div id="filters"><label class="search"><span>⌕</span><input id="q" placeholder="Rechercher un exercice…" aria-label="Rechercher un exercice"></label><div class="chips" id="chips"></div></div></header><main class="content"><div id="library" class="list"></div><div id="sections" class="hidden"></div></main></section><section id="detail" class="hidden"><header><div class="detailHead"><button class="back" id="back" aria-label="Retour">‹</button><div><div class="detailTitle" id="exerciseName"></div><div class="detailSub" id="exerciseSub"></div></div><button class="detailFav" id="detailFav" aria-label="Favori">☆</button></div><div class="tabs"><button class="active" data-tab="Anatomie">Anatomie</button><button data-tab="Bon geste">Bon geste</button><button data-tab="Conseils">Conseils</button></div></header><div class="sheet"><div id="anatomyPanel"></div><div id="movementPanel" class="hidden"></div><div id="advicePanel" class="hidden"></div><button class="add" id="add">＋ Ajouter à ma séance</button></div></section></div><div id="toast"></div><script>
'use strict';
const catalog=[['Curl à la barre','Biceps','Barre'],['Curl incliné haltères','Biceps','Haltères'],['Curl marteau','Biceps','Haltères'],['Curl concentration','Biceps','Haltères'],['Curl inversé','Avant-bras','Barre'],['Développé couché','Pectoraux','Barre'],['Développé incliné haltères','Pectoraux','Haltères'],['Écartés haltères','Pectoraux','Haltères'],['Pompes','Pectoraux','Poids du corps'],['Rowing haltère','Dos','Haltères'],['Rowing barre','Dos','Barre'],['Tractions','Dos','Poids du corps'],['Shrugs','Trapèzes','Haltères'],['Élévations latérales','Épaules','Haltères'],['Développé militaire','Épaules','Barre'],['Oiseau haltères','Épaules','Haltères'],['Extension triceps','Triceps','Haltères'],['Barre au front','Triceps','Barre'],['Dips','Triceps','Poids du corps'],['Squat','Jambes','Barre'],['Fentes','Jambes','Haltères'],['Soulevé de terre','Dos / Jambes','Barre'],['Gainage','Abdominaux','Poids du corps'],['Crunch','Abdominaux','Poids du corps']].map((a,i)=>({id:i,name:a[0],muscle:a[1],equipment:a[2]}));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data;try{data=JSON.parse(localStorage.getItem('cockpit_muscu_2'))||{favorites:[0],session:[],history:[]}}catch(e){data={favorites:[0],session:[],history:[]}};let nav='Bibliothèque',filter='Tous',selected=catalog[0],tab='Anatomie';function save(){localStorage.setItem('cockpit_muscu_2',JSON.stringify(data))}function toast(s){const el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',2400)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderLibrary(){let chips=['Tous','Pectoraux','Dos','Épaules','Biceps','Triceps','Jambes','Abdominaux'];$('#chips').innerHTML=chips.map(x=>`<button class="${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('');$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderLibrary()});const q=$('#q').value.toLocaleLowerCase('fr');const found=catalog.filter(x=>(filter==='Tous'||x.muscle.includes(filter))&&`${x.name} ${x.equipment}`.toLocaleLowerCase('fr').includes(q));$('#library').innerHTML=found.map(x=>`<div class="exercise" data-ex="${x.id}"><div class="thumb">${x.id===0?'<img src="vignette.webp" alt="Curl à la barre">':esc(x.muscle)}</div><div style="flex:1"><strong>${esc(x.name)}</strong><small>${esc(x.muscle)} · ${esc(x.equipment)}</small></div><button class="star ${data.favorites.includes(x.id)?'on':''}" data-fav="${x.id}" aria-label="Favori">${data.favorites.includes(x.id)?'★':'☆'}</button></div>`).join('')||'<div style="padding:24px;text-align:center">Aucun exercice trouvé.</div>';$$('[data-ex]').forEach(e=>e.onclick=()=>openExercise(+e.dataset.ex));$$('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(+b.dataset.fav);renderLibrary()})}function toggleFav(id){data.favorites=data.favorites.includes(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id];save()}
function openExercise(id){selected=catalog[id];$('#exerciseName').textContent=selected.name;$('#exerciseSub').textContent=selected.muscle+' · '+selected.equipment;$('#detailFav').textContent=data.favorites.includes(id)?'★':'☆';$('#home').classList.add('hidden');$('#detail').classList.remove('hidden');setTab('Anatomie');window.scrollTo(0,0)}function setTab(next){tab=next;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#anatomyPanel').classList.toggle('hidden',tab!=='Anatomie');$('#movementPanel').classList.toggle('hidden',tab!=='Bon geste');$('#advicePanel').classList.toggle('hidden',tab!=='Conseils');const isCurl=selected.id===0;$('#anatomyPanel').innerHTML=isCurl?`<img class="anatomy" src="anatomie.webp" alt="Deux positions anatomiques du curl à la barre"><div class="legend"><span><i class="dot"></i>Biceps brachial</span><span><i class="dot orange"></i>Brachial et brachio-radial</span></div><h3>Description</h3><p>Le curl à la barre sollicite principalement les fléchisseurs du coude. Maintiens les coudes près du buste et contrôle la descente.</p>`:`<div class="notice">Illustration anatomique spécifique en préparation pour cet exercice. Aucune image d'un autre mouvement ne sera utilisée.</div><h3>${esc(selected.name)}</h3><p>Groupe musculaire : ${esc(selected.muscle)}. Équipement : ${esc(selected.equipment)}.</p>`;$('#movementPanel').innerHTML=isCurl?`<img class="move" src="geste.webp" alt="Deux positions fixes du curl à la barre"><div class="notice"><strong>Deux positions de référence.</strong> Aucune vidéo n'est intégrée pour le moment. Nous ajouterons uniquement un mouvement de curl à la barre vérifié et librement utilisable.</div>`:`<div class="notice">Démonstration animée non disponible pour cet exercice. Aucun GIF d'un autre mouvement ne sera affiché.</div>`;$('#advicePanel').innerHTML=`<h3>Points clés du bon geste</h3><div class="tips"><div><span class="check">✓</span>Adopte une posture stable et gainée.</div><div><span class="check">✓</span>Choisis une charge maîtrisable.</div><div><span class="check">✓</span>Contrôle la phase de descente.</div><div><span class="check">✓</span>Arrête le mouvement en cas de douleur.</div></div>`}
function renderSection(){const root=$('#sections');if(nav==='Séances'){root.innerHTML=`<div class="panel"><h2>Ma séance</h2><div class="card"><strong>${data.session.length} exercice${data.session.length>1?'s':''} au programme</strong><div id="sessionList">${data.session.length?data.session.map((s,i)=>`<div class="session-item"><span>${esc(catalog[s.id].name)}<br><small>${s.sets} séries · ${s.reps} reps · ${s.weight} kg</small></span><button class="smallbtn danger" data-remove="${i}">Retirer</button></div>`).join(''):'<p>Ajoute un exercice depuis la Bibliothèque.</p>'}</div>${data.session.length?'<button class="primary" id="finish">Terminer et enregistrer la séance</button>':'<button class="primary" id="goLibrary">Choisir un exercice</button>'}</div></div>`;$$('[data-remove]').forEach(b=>b.onclick=()=>{data.session.splice(+b.dataset.remove,1);save();renderSection()});if($('#finish'))$('#finish').onclick=()=>{data.history.unshift({date:new Date().toISOString(),session:JSON.parse(JSON.stringify(data.session))});data.session=[];save();renderSection();toast('Séance enregistrée')};if($('#goLibrary'))$('#goLibrary').onclick=()=>switchNav('Bibliothèque')}
else if(nav==='Statistiques'){const n=data.history.length,total=data.history.reduce((a,s)=>a+s.session.reduce((b,x)=>b+x.sets,0),0);root.innerHTML=`<div class="panel"><h2>Statistiques</h2><div class="card"><div class="stat">${n}</div><p>Séances enregistrées</p><div class="stat">${total}</div><p>Séries effectuées</p></div><div class="card"><strong>Historique</strong>${n?data.history.slice(0,15).map(s=>`<div class="session-item"><span>${new Date(s.date).toLocaleDateString('fr-FR')}</span><span>${s.session.length} exercice(s)</span></div>`).join(''):'<p>Aucune séance terminée pour le moment.</p>'}</div></div>`}
else{root.innerHTML=`<div class="panel"><h2>Réglages</h2><div class="card"><strong>Mes données</strong><p>Les séances sont conservées sur cet appareil, dans ce navigateur.</p><div class="setting"><span>Exporter une sauvegarde</span><button class="smallbtn" id="export">Exporter</button></div><div class="setting"><span>Importer une sauvegarde</span><label class="smallbtn" for="import">Importer</label><input type="file" id="import" accept="application/json" hidden></div><div class="setting"><span>Réinitialiser l'application</span><button class="smallbtn danger" id="reset">Effacer</button></div></div><div class="card"><strong>Cockpit Muscu 2.0</strong><p>Version initiale gratuite. Les démonstrations sont ajoutées uniquement après vérification du mouvement et de leurs droits.</p></div></div>`;$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='cockpit-muscu-2-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());if(!Array.isArray(parsed.session)||!Array.isArray(parsed.history)||!Array.isArray(parsed.favorites))throw Error('format');data=parsed;save();renderSection();toast('Sauvegarde importée')}catch(e){toast('Fichier non reconnu')}};$('#reset').onclick=()=>{if(confirm('Effacer toutes les données de Cockpit Muscu 2.0 ?')){data={favorites:[0],session:[],history:[]};save();renderSection()}}}}
function switchNav(n){nav=n;$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));const lib=nav==='Bibliothèque';$('#filters').classList.toggle('hidden',!lib);$('#library').classList.toggle('hidden',!lib);$('#sections').classList.toggle('hidden',lib);if(lib)renderLibrary();else renderSection();window.scrollTo(0,0)}$$('[data-nav]').forEach(b=>b.onclick=()=>switchNav(b.dataset.nav));$$('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#q').oninput=renderLibrary;$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#home').classList.remove('hidden');renderLibrary()};$('#detailFav').onclick=()=>{toggleFav(selected.id);$('#detailFav').textContent=data.favorites.includes(selected.id)?'★':'☆'};$('#add').onclick=()=>{if(data.session.some(x=>x.id===selected.id)){toast('Exercice déjà dans la séance');return}const sets=prompt('Nombre de séries :','3');if(sets===null)return;const reps=prompt('Répétitions par série :','10');if(reps===null)return;const weight=prompt('Charge en kg :','0');if(weight===null)return;const s=+sets,r=+reps,w=+weight;if(!Number.isInteger(s)||s<1||s>20||!Number.isInteger(r)||r<1||r>100||!Number.isFinite(w)||w<0){toast('Valeurs incorrectes');return}data.session.push({id:selected.id,sets:s,reps:r,weight:w});save();$('#detail').classList.add('hidden');$('#home').classList.remove('hidden');switchNav('Séances');toast('Exercice ajouté')};renderLibrary();
</script></body></html>
